<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="skewX(-40)">
      <rect width="14" height="14" fill="#fafaf9"/>
      <rect width="7" height="14" fill="#1c1917"/>
    </pattern>
  </defs>
  <!-- Arm, swung open about the hinge -->
  <g transform="rotate(-15 5 25)">
    <rect x="4" y="15" width="56" height="9" rx="2" fill="url(#stripes)" stroke="#1c1917" stroke-width="1.5"/>
  </g>
  <!-- Striped band and the slate -->
  <rect x="4" y="26" width="56" height="9" rx="2" fill="url(#stripes)" stroke="#1c1917" stroke-width="1.5"/>
  <rect x="4" y="37" width="56" height="23" rx="4" fill="url(#body)" stroke="#1c1917" stroke-width="1.5"/>
  <circle cx="7.5" cy="25" r="2.5" fill="#1c1917"/>
</svg>
