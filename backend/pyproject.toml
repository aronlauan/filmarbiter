[project]
name = "filmarbiter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "letterboxdpy>=6.7.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
ingest = [
    "polars>=2.1.0",
    "sentence-transformers>=6.3.0",
]

[tool.uv]
# Local `uv sync` installs everything. The server only needs the main dependencies:
# deploys run `uv sync --no-default-groups` (see render.yaml), skipping PyTorch.
default-groups = ["dev", "ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
